# Copy this file to compose.yaml and adjust the paths and public URLs for your host.
name: gaida

x-service: &service
  restart: unless-stopped
  environment: &aspnet-environment
    ASPNETCORE_URLS: http://+:8080
    ASPNETCORE_ENVIRONMENT: Production

services:
  gaida-local:
    <<: *service
    build:
      context: .
      dockerfile: Gaida.Pods.MusicDatabase/Dockerfile
    environment:
      <<: *aspnet-environment
      STORAGE: /music
      ALBUM_COVERS: /covers
      # Must be an absolute URL for the host that serves /Album_Covers.
      DOMAIN: ${PUBLIC_DOMAIN:-http://localhost}
    volumes:
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/music
      - ${ALBUM_COVERS_PATH:-./data/covers}:/covers

  gaida-youtube:
    <<: *service
    build:
      context: .
      dockerfile: Gaida.Pods.YouTube/Dockerfile
    environment:
      <<: *aspnet-environment
      YOUTUBE_CACHE_DB: /cache/YouTube.json
      YOUTUBE_CACHE: /webm
    volumes:
      - ${YOUTUBE_CACHE_DB_PATH:-./data/youtube-cache}:/cache
      - ${YOUTUBE_AUDIO_CACHE_PATH:-./data/youtube-audio}:/webm

  gaida-api:
    <<: *service
    build:
      context: .
      dockerfile: Gaida.API/Dockerfile
    environment:
      <<: *aspnet-environment
      Platforms__0__Url: http://gaida-local:8080
      Platforms__0__Ids: audio://
      Platforms__1__Url: http://gaida-youtube:8080
      Platforms__1__Ids: yt://,yt-playlist://
      PublicApiBaseUrl: ${PUBLIC_API_BASE_URL:-http://localhost:5340}
      THUMBNAIL_CACHE: /thumbnails
      Random__Shares__youtube: ${YOUTUBE_RANDOM_SHARE:-0.4}
    ports:
      - "${GAIDA_API_PORT:-5340}:8080"
    volumes:
      - thumbnails:/thumbnails
    depends_on:
      - gaida-local
      - gaida-youtube

  dunav:
    <<: *service
    build:
      context: .
      dockerfile: Dunav/Dockerfile
    environment:
      <<: *aspnet-environment
      Gaida__Url: http://gaida-api:8080
      Dunav__RetentionMinutes: ${DUNAV_RETENTION_MINUTES:-45}
      Dunav__MaxBytes: ${DUNAV_MAX_BYTES:-4294967296}
    ports:
      - "${DUNAV_PORT:-5341}:8080"
    mem_limit: ${DUNAV_MEMORY_LIMIT:-6g}
    depends_on:
      - gaida-api

  selo:
    <<: *service
    build:
      context: .
      dockerfile: Selo/Dockerfile
    environment:
      <<: *aspnet-environment
      Gaida__Url: http://gaida-api:8080
    ports:
      - "${SELO_PORT:-5342}:8080"
    depends_on:
      - gaida-api

volumes:
  thumbnails:
