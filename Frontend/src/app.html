<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- the svg is the mark itself; the png is the fallback for browsers that take no svg icon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#14121f" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-surface-0 text-chalk font-body flex flex-col items-center leading-relaxed antialiased"
	>
		%sveltekit.body%
	</body>
</html>
