# Deployed copy of the audio proxy config, for reference and rebuilds.

# ── /etc/nginx/audio-proxy.conf ──────────────────────────────────────────────
# Shared settings for the api.example.com /Audio* blocks, which proxy to the compose.yaml services.
#
# Deliberately declares no add_header. nginx inherits add_header from an outer level ONLY when the
# current level declares none of its own, so a single CORS header here would silently drop HSTS,
# CSP, X-Content-Type-Options and Referrer-Policy from ssl.conf and headers.conf. The app sets
# Access-Control-Allow-Origin itself, wide open on purpose (see Gaida.API/Program.cs), so the
# proxy_hide_header/add_header pair these blocks used to carry was re-adding an identical value at
# the cost of every security header on the vhost.
#
# This mirrors /etc/nginx/proxy.conf but deliberately omits proxy_read_timeout and
# proxy_send_timeout: nginx rejects a directive that appears twice in one context, and includes are
# textual, so including proxy.conf here would make the per-location timeouts below a duplicate
# rather than an override. Each /Audio* block sets its own.

proxy_redirect          off;
proxy_set_header        Host $host;
proxy_set_header        X-Real-IP $remote_addr;
proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto $scheme;
client_max_body_size    10m;
client_body_buffer_size 128k;
proxy_connect_timeout   90;
proxy_buffers           32 4k;

# HTTP/1.0 -- nginx's proxy default -- has no chunked transfer encoding, so a streaming body with
# no Content-Length cannot be relayed incrementally. Required for the audio paths, not tuning.
proxy_http_version 1.1;

# ── /etc/nginx/sites/api.example.com.conf (the /Audio* half; rest of the vhost unchanged) ──
  # Covers /Audio/Download/{codec}/{bitrate} and /Audio/DownloadRaw on one prefix.
  # Must never point at gaida_api: Dunav's coalescing is what stops N simultaneous requests for a
  # cold track from becoming N ffmpeg processes, and it only holds if every content request goes
  # through it.
  location /Audio/Download {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dunav;

    # Audio plays while it encodes. With buffering on, nginx holds the whole encode before sending
    # a byte -- 1.9s of silence on a cold 3:22 track, measured.
    proxy_buffering off;
    proxy_request_buffering off;

    # proxy.conf's 90s covers the gap between bytes, which is fine mid-stream but not the cold start.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip off;   # opus/aac/mp3 are already compressed
  }

  # Warms an encode, returns 202/200 with no body.
  location /Audio/Preload {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dunav;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # /Audio/Search, /Audio/RandomResults, /Audio/Cover, /Audio/FindQueryType,
  # /Audio/Local/Variant, /Audio/Browse, /Audio/Artist/*.
  location /Audio {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://gaida_api;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # One block for CreateRoom, Rooms and Join -- all under this prefix, all happy on these settings.
  # $connection_upgrade comes from the map in nginx.conf:14 and sends "close" on a non-upgrade
  # request, where the old hardcoded "Upgrade" was sent unconditionally.
  location /Audio/Multiplayer {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://selo;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Rooms stay open for hours; proxy.conf's 90s would drop every member of a quiet room.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

     
